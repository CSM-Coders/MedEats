name: MedEats CI Pipeline

on:
  push:
    branches: [main, develop, Refactorizacion]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — Lint, Tests & Security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medeats_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: med-eats-backend/requirements.txt

      - name: Install system deps (libmagic for python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        working-directory: med-eats-backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Black (format check)
        working-directory: med-eats-backend
        run: black --check .

      - name: Run Ruff (linting)
        working-directory: med-eats-backend
        run: ruff check .

      - name: Django system check
        working-directory: med-eats-backend
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          DJANGO_DEBUG: "True"
          DB_HOST: localhost
          DB_NAME: medeats_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py check

      - name: Run tests
        working-directory: med-eats-backend
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          DJANGO_DEBUG: "True"
          DB_HOST: localhost
          DB_NAME: medeats_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py test --verbosity=2

  frontend:
    name: Frontend — Lint, Types & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: med-eats-mobile/package-lock.json

      - name: Install dependencies
        working-directory: med-eats-mobile
        run: npm ci

      - name: Run ESLint
        working-directory: med-eats-mobile
        run: npx eslint .

      - name: TypeScript check
        working-directory: med-eats-mobile
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: med-eats-mobile
        run: npm test -- --watchAll=false

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install bandit (security linter)
        run: pip install "bandit[toml]"

      - name: Run bandit security scan
        working-directory: med-eats-backend
        run: bandit -r . -x ./migrations,./tests.py,./venv -ll
